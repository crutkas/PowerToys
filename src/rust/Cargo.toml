[workspace]
resolver = "2"
members = [
    "powertoys-module-ffi",
    "modules/awake-module-interface",
    "modules/alwaysontop-module-interface",
    "modules/advancedpaste-module-interface",
    "modules/cmdnotfound-module-interface",
    "modules/cmdpal-module-interface",
    "modules/cropandlock-module-interface",
    "modules/fancyzones-module-interface",
    "modules/lightswitch-module-interface",
    "modules/mousewithoutborders-module-interface",
    "modules/poweraccent-module-interface",
    "modules/powerdisplay-module-interface",
    "modules/powerocr-module-interface",
    "modules/shortcutguide-module-interface",
    "modules/workspaces-module-interface",
    "modules/zoomit-module-interface",
    "apps/alwaysontop",
    "apps/poweraccent",
    "tests/integration",
]

# Release profile: optimize for size with LTO
[profile.release]
opt-level = "z"        # optimize for size over speed
lto = true             # link-time optimization — eliminates dead code across crates
codegen-units = 1      # single codegen unit — slower compile, better optimization
strip = "symbols"      # strip debug symbols from binary
panic = "abort"        # no unwind tables — smaller binary, less RAM

[workspace.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_System_Registry",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
