[package]
name = "measuretool-module-interface"
version = "0.1.0"
edition = "2024"
description = "MeasureTool module interface for PowerToys — Rust implementation"
build = "build.rs"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
powertoys-module-ffi = { path = "../../powertoys-module-ffi" }
measuretool-core = { path = "../../libs/measuretool-core" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
