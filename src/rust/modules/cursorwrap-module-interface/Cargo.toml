[package]
name = "cursorwrap-module-interface"
version = "0.1.0"
edition = "2024"
description = "CursorWrap module interface for PowerToys — Rust implementation"
build = "build.rs"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
cursorwrap-core = { path = "../../libs/cursorwrap-core" }
powertoys-module-ffi = { path = "../../powertoys-module-ffi" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
] }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
cc = "1"
