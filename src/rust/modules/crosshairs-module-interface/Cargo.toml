[package]
name = "crosshairs-module-interface"
version = "0.1.0"
edition = "2024"
description = "Mouse Pointer Crosshairs module interface for PowerToys — Rust implementation"

[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
powertoys-module-ffi = { path = "../../powertoys-module-ffi" }
crosshairs-core = { path = "../../libs/crosshairs-core" }
powertoys-win32 = { path = "../../libs/powertoys-win32" }
windows = { version = "0.58", features = [
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Foundation_Numerics",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
