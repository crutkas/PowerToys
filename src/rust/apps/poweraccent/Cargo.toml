[package]
name = "powertoys-poweraccent"
version = "0.1.0"
edition = "2024"
description = "PowerToys PowerAccent - Rust implementation"

[[bin]]
name = "PowerToys-PowerAccent"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
