[package]
name = "powertoys-fancyzones"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "PowerToys-FancyZones"
path = "src/main.rs"

[dependencies]
fancyzones-core = { path = "../../libs/fancyzones-core" }
fancyzones-engine = { path = "../../libs/fancyzones-engine" }
powertoys-win32 = { path = "../../libs/powertoys-win32" }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
] }
