[package]
name = "measuretool"
version = "0.1.0"
edition = "2024"
description = "MeasureTool (Screen Ruler) application for PowerToys"

[[bin]]
name = "measuretool"
path = "src/main.rs"

[lib]
name = "measuretool_app"
path = "src/lib.rs"

[dependencies]
measuretool-core = { path = "../../libs/measuretool-core" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
