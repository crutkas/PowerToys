[package]
name = "filelocksmith-cli"
version = "0.1.0"
edition = "2024"
description = "FileLocksmith CLI - finds which processes have file handles open"


[[bin]]
name = "filelocksmith"
path = "src/main.rs"

[dependencies]
filelocksmith-core = { path = "../../libs/filelocksmith-core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
