[package]
name = "workspaces-launcher"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "PowerToys_WorkspacesLauncher"
path = "src/main.rs"

[dependencies]
powertoys-win32 = { path = "../../libs/powertoys-win32" }
workspaces-core = { path = "../../libs/workspaces-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_System_Threading","Win32_UI_WindowsAndMessaging","Win32_UI_Shell","Win32_Security","Win32_System_Com","Win32_System_Registry"] }
