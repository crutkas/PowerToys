[package]
name = "workspaces-snapshot"
version = "0.1.0"
edition = "2024"
description = "Captures the current window layout as a workspace project"

[[bin]]
name = "PowerToys_WorkspacesSnapshotTool"
path = "src/main.rs"

[dependencies]
powertoys-win32 = { path = "../../libs/powertoys-win32" }
workspaces-core = { path = "../../libs/workspaces-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
] }
